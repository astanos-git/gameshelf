<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Game Shelf</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Shelf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: profile strip → summary figures → sticky filter bar → one list of game rows that expand for detail */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --line: #d6dce7;
  --fg: #141a26;
  --muted: #5b6477;
  --accent: #1f5fd6;
  --accent-soft: #e2ebfb;
  --bronze: #b46f3c; --silver: #8d97a6; --gold: #c99a14; --plat: #5d8fc9;
  --mc-good: #2f8f3a; --mc-mid: #c28a00; --mc-bad: #c8412f;
  --st-done: #2f8f3a; --st-started: #1f5fd6; --st-unplayed: #7a6a9e;
  --warn: #9a6b00; --warn-bg: #fdf3d8; --bad: #b3261e; --bad-bg: #fbe4e1;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1320; --surface: #161d2d; --line: #26304a; --fg: #e6eaf3; --muted: #95a0b8;
  --accent: #6a9cff; --accent-soft: #1d2b4d;
  --bronze: #d08d5a; --silver: #b4bdca; --gold: #e3b93b; --plat: #8fb8ea;
  --mc-good: #5cc26a; --mc-mid: #e0ac2a; --mc-bad: #ec6b58;
  --st-done: #5cc26a; --st-started: #6a9cff; --st-unplayed: #ad9bd6;
  --warn: #f0c14b; --warn-bg: #3a2f10; --bad: #ff8a7a; --bad-bg: #3d1a17;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #161d2d; --line: #26304a; --fg: #e6eaf3; --muted: #95a0b8;
  --accent: #6a9cff; --accent-soft: #1d2b4d;
  --bronze: #d08d5a; --silver: #b4bdca; --gold: #e3b93b; --plat: #8fb8ea;
  --mc-good: #5cc26a; --mc-mid: #e0ac2a; --mc-bad: #ec6b58;
  --st-done: #5cc26a; --st-started: #6a9cff; --st-unplayed: #ad9bd6;
  --warn: #f0c14b; --warn-bg: #3a2f10; --bad: #ff8a7a; --bad-bg: #3d1a17;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
.wrap { max-width: 880px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 48px; display: grid; gap: 16px; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.sample { background: var(--accent-soft); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; font-size: 13px; }
.alert { border: 1px solid; border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; font-size: 14px; }
.alert.bad { background: var(--bad-bg); border-color: var(--bad); }
.alert.warn { background: var(--warn-bg); border-color: var(--warn); }
.alert h2 { font-size: 20px; line-height: 1.1; }
.alert.bad h2 { color: var(--bad); } .alert.warn h2 { color: var(--warn); }
.alert ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.alert a { color: inherit; font-weight: 600; }
.alert code { font: 13px var(--mono); overflow-wrap: anywhere; }
.alert p { margin: 0; }
.expiry.soon { color: var(--warn); font-weight: 600; }
.expiry.past { color: var(--bad); font-weight: 600; }

/* profile */
.profile { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center;
  font: 600 22px var(--display); color: var(--accent); overflow: hidden; flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.who { flex: 1 1 180px; min-width: 0; display: grid; gap: 4px; }
.who h1 { font-size: 30px; line-height: 1; letter-spacing: .01em; }
.level { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.level .bar { flex: 0 1 140px; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.level .bar i { display: block; height: 100%; background: var(--accent); }
.tiers { display: flex; gap: 12px; font: 500 14px var(--mono); }
.tier { display: flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.d-platinum { background: var(--plat); } .d-gold { background: var(--gold); } .d-silver { background: var(--silver); } .d-bronze { background: var(--bronze); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs a { padding: 6px 12px 8px; color: var(--muted); text-decoration: none; font: 600 17px var(--display); letter-spacing: .03em; text-transform: uppercase; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a[aria-current="page"] { color: var(--fg); border-color: var(--accent); }
.tabs a:hover { color: var(--fg); }
.hltb { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13.5px; }
.hltb b { font: 600 13px var(--mono); }
.updated { width: 100%; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.refresh { color: var(--accent); font-weight: 600; text-decoration: none; border: 1px solid var(--accent); border-radius: 999px; padding: 3px 12px; }
.refresh:hover { background: var(--accent-soft); }

/* figures */
.figures { display: grid; grid-template-columns: repeat(4, 1fr); border-block: 1px solid var(--line); }
.fig { padding: 10px 4px; display: grid; gap: 0; }
.fig + .fig { border-left: 1px solid var(--line); padding-left: 12px; }
.fig b { font: 600 30px/1.1 var(--display); }
.fig span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
@media (max-width: 520px) { .figures { grid-template-columns: repeat(2, 1fr); }
  .fig:nth-child(3) { border-left: 0; padding-left: 4px; } .fig:nth-child(n+3) { border-top: 1px solid var(--line); } }

/* controls */
.controls { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg); padding-block: 8px; display: grid; gap: 8px; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip small { font-family: var(--mono); opacity: .7; margin-left: 4px; }
.row2 { display: flex; gap: 8px; }
.row2 input { flex: 1 1 auto; min-width: 0; }
.row2 input, .row2 select { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 14px; }

/* list */
.list { display: grid; gap: 8px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.game > button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; }
.game > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cover { width: 56px; height: 56px; border-radius: 8px; background: var(--accent-soft); display: grid; place-items: center; overflow: hidden;
  font: 600 18px var(--display); color: var(--accent); }
.cover img { width: 100%; height: 100%; object-fit: cover; }
.main { min-width: 0; display: grid; gap: 4px; }
.name { font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.pill { font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; border-radius: 4px; padding: 1px 6px; border: 1px solid currentColor; }
.st-completed { color: var(--st-done); } .st-started { color: var(--st-started); } .st-unplayed { color: var(--st-unplayed); }
.prog { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--muted); }
.prog .bar { flex: 1 1 auto; max-width: 220px; height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--accent); }
.prog.plat .bar i { background: var(--plat); }
.mc { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; font: 600 19px var(--display); color: #fff; }
.mc.good { background: var(--mc-good); } .mc.mid { background: var(--mc-mid); } .mc.bad { background: var(--mc-bad); }
.mc.none { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: 13px; }
.detail { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: grid; gap: 10px; font-size: 13.5px; }
.pending { display: flex; gap: 14px; flex-wrap: wrap; font: 13px var(--mono); }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 16px; margin: 0; }
.facts div { display: grid; }
.facts dt { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.facts dd { margin: 0; }
.detail a { color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }
@media (max-width: 420px) { .game > button { grid-template-columns: 48px 1fr auto; gap: 10px; } .cover { width: 48px; height: 48px; } }
</style>

<div class="wrap">
  <div class="sample" id="sample" hidden>Showing <b>sample data</b>. Your own games appear here after the first successful refresh on GitHub.</div>
  <section class="alert" id="alert" hidden></section>
  <nav class="tabs"><a href="index.html" aria-current="page">Library</a><a href="stats.html">Stats</a></nav>

  <header class="profile">
    <div class="avatar" id="avatar"></div>
    <div class="who">
      <h1 id="psnName">—</h1>
      <div class="level"><span>Level <b class="num" id="lvl">–</b></span><span class="bar"><i id="lvlBar"></i></span><span class="num" id="lvlPct"></span></div>
    </div>
    <div class="tiers" id="tiers"></div>
    <div class="updated"><span id="updated"></span><span class="expiry" id="expiry" hidden></span><a class="refresh" id="refresh" target="_blank" rel="noopener" hidden>Refresh data</a></div>
  </header>

  <section class="figures" id="figures"></section>

  <div class="controls">
    <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
    <div class="row2">
      <input id="q" type="search" placeholder="Search games" aria-label="Search games">
      <select id="sort" aria-label="Sort by">
        <option value="recent">Recent activity</option>
        <option value="metacritic">Metacritic</option>
        <option value="hours">Hours played</option>
        <option value="progress">Trophy progress</option>
        <option value="left">Trophies left</option>
        <option value="beat">Time to beat</option>
        <option value="name">Name</option>
      </select>
    </div>
  </div>

  <main class="list" id="list"></main>
</div>

<script>
const SAMPLE = {
  generated_at: "2026-09-27T19:12:00+00:00",
  login: { since: new Date(Date.now() - 51 * 864e5).toISOString(), expires_estimate: new Date(Date.now() + 9 * 864e5).toISOString() },
  profile: { online_id: "SampleGamer", avatar: null, trophy_level: 412, level_progress: 63,
    earned: { platinum: 14, gold: 131, silver: 402, bronze: 1618 } },
  games: [
    g("Astro Bot", ["PS5"], 22.4, 100, [44,5,1,1], [44,5,1,1], 94, ["Platformer"], "2024-09-06", "2026-09-20"),
    g("Elden Ring", ["PS5"], 118.2, 71, [30,8,2,0], [32,9,9,1], 96, ["Action", "RPG"], "2022-02-25", "2026-09-26"),
    g("Final Fantasy VII Rebirth", ["PS5"], 64.0, 38, [25,4,1,0], [60,12,8,1], 92, ["RPG"], "2024-02-29", "2026-08-30"),
    g("Ghost of Tsushima", ["PS4", "PS5"], 58.7, 100, [39,10,2,1], [39,10,2,1], 87, ["Action", "Adventure"], "2020-07-17", "2025-11-02"),
    g("Returnal", ["PS5"], 14.1, 22, [8,2,0,0], [23,11,1,1], 86, ["Action", "Shooter"], "2021-04-30", "2025-03-14"),
    g("Stray", ["PS5"], 0, null, null, null, 83, ["Adventure"], "2022-07-19", null, true),
    g("Horizon Forbidden West", ["PS4", "PS5"], 0, null, null, null, 88, ["Action", "RPG"], "2022-02-18", null, true),
    g("Death Stranding Director's Cut", ["PS5"], 0, null, null, null, 85, ["Action"], "2021-09-24", null, true),
    g("Kena: Bridge of Spirits", ["PS5"], 0, null, null, null, 81, ["Adventure"], "2021-09-21", null, true),
    g("Uncharted 2: Among Thieves", ["PS3"], 0, 54, [28,6,2,0], [36,10,5,1], 96, ["Action"], "2009-10-13", "2012-06-02", false),
    g("Gran Turismo 7", ["PS5"], 41.5, 49, [20,9,3,0], [36,15,5,1], 87, ["Racing"], "2022-03-04", "2026-07-18"),
    g("Sackboy: A Big Adventure", ["PS5"], 3.2, 8, [4,0,0,0], [39,10,4,1], 79, ["Platformer"], "2020-11-12", "2024-12-26"),
  ]
};
const SAMPLE_HLTB = { "Elden Ring": [59, 100, 134], "Astro Bot": [11, 15, 21], "Stray": [5, 6.5, 9], "Horizon Forbidden West": [30, 58, 91],
  "Final Fantasy VII Rebirth": [45, 74, 107], "Death Stranding Director's Cut": [43, 61, 104], "Kena: Bridge of Spirits": [10, 12.5, 23], "Returnal": [22, 33, 53] };
SAMPLE.games.forEach(x => { const h = SAMPLE_HLTB[x.name]; if (h) x.hltb = { main: h[0], extra: h[1], complete: h[2] }; });
function g(name, platforms, hours, progress, earned, defined, metacritic, genres, released, last, owned = true) {
  const t = a => a && { bronze: a[0], silver: a[1], gold: a[2], platinum: a[3] };
  const e = t(earned), d = t(defined), sum = o => o ? Object.values(o).reduce((x, y) => x + y, 0) : 0;
  const platinum = !!(e && e.platinum);
  return { name, platforms, hours, progress, earned: e, defined: d, metacritic, genres, released,
    owned, image: null, last_activity: last, last_played: platforms.includes("PS3") ? null : last, first_played: null, last_trophy: progress ? last : null,
    acquired: owned ? released : null, trophies_earned: sum(e), trophies_total: sum(d), platinum,
    status: platinum || progress === 100 ? "completed" : (hours > 0 || progress > 0) ? "started" : "unplayed" };
}

const TIERS = ["platinum", "gold", "silver", "bronze"];
const STATUS = { all: "All", unplayed: "Backlog", started: "In progress", completed: "Completed" };
const STATUS_LABEL = { unplayed: "Backlog", started: "In progress", completed: "Completed" };
const $ = id => document.getElementById(id);
let DATA, state = { status: "all", q: "", sort: "recent", open: null };
try { Object.assign(state, JSON.parse(localStorage.getItem("shelf") || "{}"), { q: "", open: null }); } catch {}

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = s => (s || "?").replace(/[^A-Za-z0-9 ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const fmtDate = s => s ? new Date(s).toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" }) : "—";
function ago(s) {
  const d = (Date.now() - new Date(s)) / 864e5;
  if (d < 1 / 24) return "just now";
  if (d < 1) return Math.round(d * 24) + " h ago";
  if (d < 45) return Math.round(d) + (Math.round(d) === 1 ? " day ago" : " days ago");
  return fmtDate(s);
}
const pic = (url, name, cls) => url
  ? `<img src="${esc(url)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('${initials(name)}'))">`
  : initials(name);
const mcClass = m => m == null ? "none" : m >= 75 ? "good" : m >= 50 ? "mid" : "bad";

function refreshUrl() {
  const h = location.hostname;
  if (!h.endsWith(".github.io")) return null;
  const owner = h.split(".")[0], repo = location.pathname.split("/").filter(Boolean)[0] || `${owner}.github.io`;
  return `https://github.com/${owner}/${repo}/actions/workflows/refresh.yml`;
}

function repoUrl() { const u = refreshUrl(); return u && u.split("/actions/")[0]; }

function renewSteps() {
  const repo = repoUrl();
  const secrets = repo
    ? `<a href="${repo}/settings/secrets/actions" target="_blank" rel="noopener">your repo's secrets</a>`
    : "your repo's <b>Settings → Secrets and variables → Actions</b>";
  return `<ol>
    <li>Sign in at <a href="https://www.playstation.com" target="_blank" rel="noopener">playstation.com</a>.</li>
    <li>In the same browser, open <a href="https://ca.account.sony.com/api/v1/ssocookie" target="_blank" rel="noopener">Sony's token page</a> and copy the value after <code>"npsso":</code> (without the quotes).</li>
    <li>Open ${secrets}, edit <code>PSN_NPSSO</code> and paste it. On a phone, switch the browser to desktop site for this step.</li>
    <li>Tap <b>Refresh data</b> again.</li>
  </ol>`;
}

function renderLogin() {
  const L = DATA.login || {}, box = $("alert"), exp = $("expiry");
  box.hidden = true; exp.hidden = true;
  if (L.error === "login_expired") {
    box.className = "alert bad"; box.hidden = false;
    box.innerHTML = `<h2>PSN login expired</h2>
      <p>The refresh on ${fmtDate(L.failed_at)} couldn't sign in to PlayStation. ${DATA.isSample ? "" : "You're seeing data from the last successful refresh."} Renew the login in about a minute:</p>${renewSteps()}`;
    return;
  }
  if (L.error === "fetch_failed") {
    box.className = "alert warn"; box.hidden = false;
    box.innerHTML = `<h2>Last refresh failed</h2>
      <p>On ${fmtDate(L.failed_at)} PlayStation's servers returned an error, so this is the data from the last successful refresh. Try again later. If it keeps failing, see "When something goes wrong" in the README.</p>
      <p><code>${esc(L.message || "")}</code></p>`;
    return;
  }
  if (L.expires_estimate) {
    const days = Math.round((new Date(L.expires_estimate) - Date.now()) / 864e5);
    exp.hidden = false;
    if (days < 0) {
      exp.className = "expiry past"; exp.textContent = "PSN login has probably expired";
      box.className = "alert warn"; box.hidden = false;
      box.innerHTML = `<h2>Renew your PSN login before refreshing</h2><p>Logins last about two months, and this one started on ${fmtDate(L.since)}.</p>${renewSteps()}`;
    } else {
      exp.className = "expiry" + (days <= 14 ? " soon" : "");
      exp.textContent = `PSN login expires in about ${days} day${days === 1 ? "" : "s"}`;
      exp.title = `Login in use since ${fmtDate(L.since)}. Estimate based on Sony's usual two-month limit.`;
    }
  }
}

function renderHeader() {
  const p = DATA.profile, games = DATA.games;
  $("psnName").textContent = p.online_id;
  $("avatar").innerHTML = pic(p.avatar, p.online_id);
  $("lvl").textContent = p.trophy_level;
  $("lvlBar").style.width = (p.level_progress || 0) + "%";
  $("lvlPct").textContent = (p.level_progress || 0) + "%";
  $("tiers").innerHTML = TIERS.map(t => `<span class="tier" title="${t}"><span class="dot d-${t}"></span><span class="num">${p.earned[t].toLocaleString()}</span></span>`).join("");
  $("updated").textContent = "Updated " + ago(DATA.generated_at);
  const url = refreshUrl();
  if (url) { $("refresh").href = url; $("refresh").hidden = false; }

  const hours = games.reduce((a, x) => a + (x.hours || 0), 0);
  const backlog = games.filter(x => x.status === "unplayed" && x.owned).length;
  const plats = games.filter(x => x.platinum).length;
  const figs = [[games.length, "Games"], [Math.round(hours).toLocaleString(), "Hours played"], [plats, "Platinums"], [backlog, "In backlog"]];
  $("figures").innerHTML = figs.map(([v, l]) => `<div class="fig"><b class="num">${v}</b><span>${l}</span></div>`).join("");
}

function renderChips() {
  const count = s => s === "all" ? DATA.games.length : DATA.games.filter(x => x.status === s).length;
  $("chips").innerHTML = Object.entries(STATUS).map(([k, v]) =>
    `<button class="chip" data-s="${k}" aria-pressed="${state.status === k}">${v}<small>${count(k)}</small></button>`).join("");
}

const SORTS = {
  recent: (a, b) => (b.last_activity || b.acquired || "").localeCompare(a.last_activity || a.acquired || ""),
  metacritic: (a, b) => (b.metacritic ?? -1) - (a.metacritic ?? -1),
  hours: (a, b) => (b.hours || 0) - (a.hours || 0),
  progress: (a, b) => (b.progress ?? -1) - (a.progress ?? -1),
  beat: (a, b) => (a.hltb?.main ?? 1e9) - (b.hltb?.main ?? 1e9),
  left: (a, b) => (b.trophies_total - b.trophies_earned) - (a.trophies_total - a.trophies_earned),
  name: (a, b) => a.name.localeCompare(b.name),
};

function renderList() {
  const q = state.q.trim().toLowerCase();
  const rows = DATA.games
    .filter(x => state.status === "all" || x.status === state.status)
    .filter(x => !q || x.name.toLowerCase().includes(q) || (x.genres || []).some(gn => gn.toLowerCase().includes(q)))
    .sort(SORTS[state.sort]);
  if (!rows.length) { $("list").innerHTML = `<p class="empty">No games match this filter.</p>`; return; }
  $("list").innerHTML = rows.map((x, i) => {
    const id = "g" + DATA.games.indexOf(x), open = state.open === id;
    const prog = x.defined
      ? `<div class="prog ${x.platinum ? "plat" : ""}"><span class="bar"><i style="width:${x.progress}%"></i></span><span class="num">${x.trophies_earned}/${x.trophies_total} · ${x.progress}%</span></div>`
      : `<div class="prog">No trophies yet</div>`;
    const hrs = x.hours ? `${x.hours.toLocaleString()} h` : (x.platforms.some(p => p === "PS3" || p === "PSVITA") ? "Playtime n/a" : "0 h");
    return `<article class="game">
      <button aria-expanded="${open}" aria-controls="${id}-d" data-id="${id}">
        <span class="cover">${pic(x.image, x.name)}</span>
        <span class="main">
          <span class="name">${esc(x.name)}</span>
          <span class="meta"><span class="pill st-${x.status}">${STATUS_LABEL[x.status]}</span><span>${x.platforms.join(" · ")}</span><span class="num">${hrs}</span>${beat(x)}</span>
          ${prog}
        </span>
        <span class="mc ${mcClass(x.metacritic)}" title="Metacritic score">${x.metacritic ?? "n/a"}</span>
      </button>
      ${open ? detail(x, id) : ""}
    </article>`;
  }).join("");
}

const fmtH = h => h >= 10 ? Math.round(h) + " h" : (Math.round(h * 2) / 2) + " h";
function beat(x) {
  const m = x.hltb?.main;
  return m ? `<span class="num" title="HowLongToBeat, main story">Beat in ~${fmtH(m)}</span>` : "";
}

function detail(x, id) {
  const pend = x.defined
    ? `<div class="pending">${TIERS.map(t => `<span class="tier"><span class="dot d-${t}"></span>${x.earned[t]}/${x.defined[t]}</span>`).join("")}<span>${x.trophies_total - x.trophies_earned} left</span></div>`
    : "";
  const facts = [
    ["Genres", (x.genres || []).join(", ") || "—"],
    ["Released", fmtDate(x.released)],
    ["Owned", x.owned ? (x.acquired ? "Since " + fmtDate(x.acquired) : "Yes") : "Not in digital library"],
    ["First played", fmtDate(x.first_played)],
    ["Last played", fmtDate(x.last_played)],
    ["Last trophy", fmtDate(x.last_trophy)],
  ];
  const H = x.hltb, hl = H ? `<div class="hltb"><span>HowLongToBeat</span>${[["Main story", H.main], ["Main + extras", H.extra], ["Completionist", H.complete]].filter(([, v]) => v).map(([k, v]) => `<span>${k} <b>${fmtH(v)}</b></span>`).join("")}${H.url ? `<a href="${esc(H.url)}" target="_blank" rel="noopener">Open</a>` : ""}</div>` : "";
  const link = x.rawg_slug ? `<a href="https://rawg.io/games/${esc(x.rawg_slug)}" target="_blank" rel="noopener">Game page on RAWG</a>` : "";
  return `<div class="detail" id="${id}-d">${pend}${hl}<dl class="facts">${facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>${link}</div>`;
}

function save() { try { localStorage.setItem("shelf", JSON.stringify({ status: state.status, sort: state.sort })); } catch {} }

$("chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return;
  state.status = b.dataset.s; if (state.status === "unplayed" && state.sort === "recent") { state.sort = "metacritic"; $("sort").value = "metacritic"; }
  save(); renderChips(); renderList(); });
$("list").addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (!b) return;
  state.open = state.open === b.dataset.id ? null : b.dataset.id; renderList(); });
$("q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
$("sort").addEventListener("change", e => { state.sort = e.target.value; save(); renderList(); });

async function start() {
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw 0;
    DATA = await r.json();
  } catch { DATA = { ...SAMPLE, isSample: true }; }
  if (!DATA.profile) DATA = { ...SAMPLE, login: DATA.login, isSample: true };  // first refresh failed
  $("sample").hidden = !DATA.isSample;
  $("sort").value = state.sort;
  renderLogin(); renderHeader(); renderChips(); renderList();
}
start();
</script>
