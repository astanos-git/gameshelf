<style>
/* Animated views of your history: Your ocean (every game a fish), Gamer fingerprint (a generative print), Hours race; the Time tunnel is its own page. */
:root { --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --ink: #eef2ff; --soft: rgba(238,242,255,.66);
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #05070f; color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#fp { position: fixed; inset: 0; width: 100%; height: 100%; display: none; touch-action: manipulation; }
#fp.on { display: block; }
.back.tunnel { background: linear-gradient(120deg, #6b4fd1, #2b6cb0); }
.seg.small button { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.fp-tools { justify-content: space-between; }
[hidden] { display: none !important; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; padding: calc(10px + var(--safe-top)) 14px 10px; display: grid; gap: 10px;
  background: linear-gradient(#05070fdd, #05070f00); pointer-events: none; }
header > * { pointer-events: auto; }
.row { display: flex; align-items: center; gap: 10px; }
.back { color: var(--ink); text-decoration: none; background: rgba(255,255,255,.1); border-radius: 999px; min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; font-weight: 600; }
h1 { font: 700 26px var(--display); margin: 0; flex: 1; letter-spacing: .01em; }
.seg { display: flex; background: rgba(255,255,255,.08); border-radius: 999px; padding: 3px; gap: 2px; width: max-content; max-width: 100%; }
.seg button { border: 0; background: none; color: var(--soft); font: 600 15px var(--body); padding: 8px 14px; border-radius: 999px; min-height: 40px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #05070f; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--soft); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.labels span { position: absolute; transform: translate(-50%, -50%); font: 600 13px var(--display); letter-spacing: .06em; color: rgba(238,242,255,.55); white-space: nowrap; text-shadow: 0 1px 6px #000; }
.labels span.edge { transform: translate(0, -50%); font: 500 12px var(--body); letter-spacing: 0; color: rgba(238,242,255,.5); }
.labels span.big { font-size: 15px; color: rgba(238,242,255,.8); }
footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 14px calc(12px + var(--safe-bottom)); display: grid; gap: 10px;
  background: linear-gradient(#05070f00, #05070fee 40%); }
.info { min-height: 58px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.info .ic { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.1); display: grid; place-items: center; font-size: 22px; }
.info .ic img { width: 100%; height: 100%; object-fit: cover; }
.info b { display: block; font: 600 17px/1.2 var(--body); }
.info small { color: var(--soft); font-size: 13.5px; }
.controls { display: flex; align-items: center; gap: 10px; }
.controls button { background: var(--ink); color: #05070f; border: 0; border-radius: 999px; min-width: 44px; min-height: 44px; font: 700 16px var(--body); cursor: pointer; padding: 0 14px; }
.controls input[type=range] { flex: 1; accent-color: #9fc4ff; height: 32px; }
.controls .yr { font: 700 30px var(--display); min-width: 64px; text-align: right; }
/* Hours race (DOM bars) */
#race { position: fixed; left: 0; right: 0; top: calc(130px + var(--safe-top)); bottom: calc(150px + var(--safe-bottom)); padding: 0 14px; z-index: 3; display: none; }
#race.on { display: block; }
.rbar { position: absolute; left: 14px; right: 14px; height: 40px; display: grid; grid-template-columns: 40px 1fr; gap: 8px; align-items: center; transition: transform .8s ease, opacity .8s; will-change: transform; }
.rbar .c { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.1); display: grid; place-items: center; font: 600 13px var(--display); }
.rbar .c img { width: 100%; height: 100%; object-fit: cover; }
.rbar .track { position: relative; height: 32px; }
.rbar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 8px; transition: width .6s linear; min-width: 4px; }
.rbar .lab { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font: 600 14px var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 70px); text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.rbar .val { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font: 700 18px var(--display); }
.racebg { position: absolute; right: 14px; bottom: 0; font: 800 120px/1 var(--display); color: rgba(238,242,255,.08); pointer-events: none; }
.note { color: var(--soft); font-size: 13px; text-align: center; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (min-width: 900px) { header, footer { max-width: 720px; margin: 0 auto; } }

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const initials = s => (s || "?").replace(/[^A-Za-z0-9 ]/g, "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fmtDate = d => d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
const info = (icon, title, sub) => { $("info").querySelector(".ic").innerHTML = icon; $("infoT").textContent = title; $("infoS").textContent = sub || ""; };
const GRADE = ["Bronze", "Silver", "Gold", "Platinum"], GCOL = ["#d08c5c", "#c9d4e6", "#ffcf4a", "#8fd0ff"];
let DATA, GAL, FLAGS = {}, view = "ocean";

/* ---------- renderer, camera, controls (for the ocean) ---------- */
const canvas = $("gl");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" }); }
catch { renderer = null; }
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
const controls = renderer ? new OrbitControls(camera, canvas) : null;
if (controls) { controls.enableDamping = true; controls.dampingFactor = 0.08; controls.autoRotate = !calm; controls.autoRotateSpeed = 0.35; controls.enablePan = false;
  controls.minDistance = 5; controls.maxDistance = 120; controls.minPolarAngle = 1.15; controls.maxPolarAngle = 1.74; }   // stay under water
const clock = new THREE.Clock();
function resize() {
  if (!renderer) return;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (ocean.uScale) { ocean.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)); oceanHome(); }
}
addEventListener("resize", resize);

/* ---------- 1. Your ocean: every game you've played is a fish ----------
   Size = hours played, colour = genre, depth = how long since you last touched it (fresh games swim in the light, forgotten ones sink).
   Platinums glow, dropped games turn grey, and the backlog waits on the seabed as eggs. Fish of the same genre school together. */
function soft() {                                   // round glowing sprite (eggs, halos, bubbles, drifting specks)
  const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d");
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(.25, "rgba(255,255,255,.85)"); g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const H = 44, R = 17, TOP = H - 5, BOTTOM = 3.5, DAY = 864e5, YEAR = 365.25 * DAY;
const GENERIC = new Set(["Action", "Adventure"]);
const mainGenre = g => { const gs = g?.genres || []; return gs.find(x => !GENERIC.has(x)) || gs[0] || "Other"; };
const OCOL = ["#ff6b6b", "#ffb347", "#ffe66d", "#7bed9f", "#4ecdc4", "#5dade2", "#a29bfe", "#fd79a8"], OOTHER = "#c3cbe0";
const SHAPES = [[1, 1], [1.45, .9], [.75, 1.1], [1.7, .8], [.62, 1], [1.2, 1.25], [.9, .85], [1.35, 1.1], [1, 1]];   // body height, body width per genre: each genre is its own species
const ocean = { scene: new THREE.Scene(), fish: [], eggs: [], T: Date.now(), t0: 0, now: Date.now(), follow: null, back: 0, R, food: null, quick: 0, home: 60 };
const U = { uTime: { value: 0 }, uH: { value: H } };
const WATER = `
uniform float uTime; uniform float uH;
vec3 water(float y) { float t = clamp(y / uH, 0., 1.); return mix(vec3(.012, .05, .12), mix(vec3(.015, .15, .29), vec3(.07, .46, .6), smoothstep(.5, 1., t)), smoothstep(0., .6, t)); }
float caust(vec2 p, float t) { p *= .33; float v = 0.; for (int i = 0; i < 3; i++) { p += vec2(sin(p.y * 1.7 + t * .6), cos(p.x * 1.3 - t * .5)) * .6; v += abs(sin(p.x + p.y)); } return pow(1. - v / 3., 3.); }
vec3 far(vec3 dir) { return water((dir.y * 1.5 + .5) * uH); }                 // the colour of open water in a direction: everything fades into it
vec3 fog(vec3 c, vec3 wp) { vec3 d = wp - cameraPosition; return mix(far(normalize(d)), c, exp(-length(d) * .011)); }`;
const hash = (s, salt = 0) => { let h = 2166136261 ^ salt; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); return ((h >>> 0) % 100000) / 100000; };
const ms = s => s ? new Date(s).getTime() : null;
const fishLen = h => 0.75 + 0.36 * Math.sqrt(h);

function fishGeometry() {                           // a small low-poly fish, nose towards +x, one unit long
  const body = new THREE.SphereGeometry(1, 16, 10); body.rotateZ(Math.PI / 2);
  const bp = body.attributes.position, pos = [], nor = [], idx = [];
  for (let i = 0; i < bp.count; i++) { const x = bp.getX(i), y = bp.getY(i), z = bp.getZ(i);
    const taper = x < 0 ? 1 - 0.25 * x * x : 1;      // slimmer towards the tail
    pos.push(0.1 + 0.4 * x, 0.2 * y * taper, 0.085 * z * taper); nor.push(x * 0.4, y, z * 1.6); }
  for (let i = 0; i < body.index.count; i++) idx.push(body.index.getX(i));
  const fin = (pts, tris) => { const b = pos.length / 3; pts.forEach(p => { pos.push(p[0], p[1], 0); nor.push(0, 0.25, 1); }); tris.forEach(t => idx.push(b + t[0], b + t[1], b + t[2])); };
  fin([[-0.24, 0], [-0.5, 0.21], [-0.41, 0], [-0.5, -0.21]], [[0, 1, 2], [0, 2, 3]]);            // forked tail
  fin([[0.24, 0.17], [-0.12, 0.15], [-0.08, 0.31]], [[0, 1, 2]]);                                 // back fin
  fin([[0.05, -0.17], [-0.12, -0.15], [-0.1, -0.26]], [[0, 1, 2]]);                               // belly fin
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3)); g.setIndex(idx);
  return g;
}
function pointsMat(extra = {}) {                    // glowing dots sized in world units
  return new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { ...U, uMap: { value: ocean.tex }, uScale: ocean.uScale, uPulse: { value: extra.pulse || 0 }, uDrift: { value: extra.drift || 0 } },
    vertexShader: WATER + `attribute float aSize; attribute vec4 aCol; uniform float uScale, uPulse, uDrift; varying vec4 vCol;
      void main() { vec3 p = position;
        if (uDrift > 0.) { p.y = mod(p.y - uTime * uDrift, uH); p.x += sin(uTime * .25 + position.z) * .8; }
        vec4 mv = modelViewMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mv;
        gl_PointSize = min(uScale * .06, aSize * (1. + uPulse * sin(uTime * 1.6 + position.x * 7.)) * uScale / max(.1, -mv.z));
        vCol = aCol; vCol.a *= exp(-length(mv.xyz) * .008); }`,
    fragmentShader: `uniform sampler2D uMap; varying vec4 vCol; void main() { gl_FragColor = vec4(vCol.rgb, vCol.a * texture2D(uMap, gl_PointCoord).a); }` });
}
function pointCloud(n, extra) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3)); geo.setAttribute("aSize", new THREE.BufferAttribute(new Float32Array(n), 1)); geo.setAttribute("aCol", new THREE.BufferAttribute(new Float32Array(n * 4), 4));
  const p = new THREE.Points(geo, pointsMat(extra)); p.frustumCulled = false; ocean.scene.add(p); return p;
}
function buildOcean() {
  const s = ocean.scene, now = ocean.now = Date.now();
  ocean.tex = soft(); ocean.uScale = { value: 800 };
  // species: the 8 genres you've spent most hours in get a colour and a body shape
  const gh = {}; DATA.games.forEach(g => { if (g.hours) gh[mainGenre(g)] = (gh[mainGenre(g)] || 0) + g.hours; });
  const genres = ocean.genres = Object.entries(gh).sort((a, b) => b[1] - a[1]).slice(0, 8).map(e => e[0]);

  /* the water itself */
  const sky = new THREE.Mesh(new THREE.SphereGeometry(900, 24, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { ...U },
    vertexShader: `varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
    fragmentShader: WATER + `varying vec3 vDir; void main() { gl_FragColor = vec4(far(normalize(vDir)), 1.); }` }));
  sky.renderOrder = -2; sky.frustumCulled = false; s.add(sky);
  const flat = (y, frag, side) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), new THREE.ShaderMaterial({ side, uniforms: { ...U },
      vertexShader: `varying vec3 vW; void main() { vec4 w = modelMatrix * vec4(position, 1.); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
      fragmentShader: WATER + `varying vec3 vW; void main() { ${frag} }` }));
    m.rotation.x = -Math.PI / 2; m.position.y = y; s.add(m); return m; };
  flat(0, `float n = sin(vW.x * .9) * sin(vW.z * .7 + sin(vW.x * .3)) * .5 + .5;
    vec3 c = vec3(.035, .075, .11) * (.75 + .5 * n) + caust(vW.xz, uTime) * vec3(.07, .2, .22);
    c *= 1. - .55 * smoothstep(8., 34., length(vW.xz)); gl_FragColor = vec4(fog(c, vW), 1.);`, THREE.FrontSide);
  flat(H, `vec3 c = vec3(.12, .55, .68) + caust(vW.xz * 1.6, uTime * 1.4) * vec3(.5, .55, .5);
    gl_FragColor = vec4(fog(c, vW), 1.);`, THREE.DoubleSide);
  // shafts of light
  for (let i = 0; i < 9; i++) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(5 + (i % 3) * 3, H + 8), new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
      uniforms: { ...U, uPh: { value: i * 1.7 } }, vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
      fragmentShader: `uniform float uTime, uPh; varying vec2 vUv; void main() { float a = pow(vUv.y, 1.7) * pow(1. - abs(vUv.x - .5) * 2., 2.) * (.075 + .055 * sin(uTime * .45 + uPh)); gl_FragColor = vec4(.55, .95, 1., a); }` }));
    const a = i * 2.4, r = 4 + (i * 7.3) % 22; m.position.set(Math.cos(a) * r, H / 2 + 3, Math.sin(a) * r); m.rotation.set(0, a * 1.3, 0.22 * (i % 2 ? 1 : -1)); m.renderOrder = 3; s.add(m);
  }
  // kelp forest around the edge
  const KN = 70, kelp = new THREE.InstancedMesh(new THREE.PlaneGeometry(1, 1, 1, 12).translate(0, .5, 0), new THREE.ShaderMaterial({ side: THREE.DoubleSide, uniforms: { ...U },
    vertexShader: WATER + `varying float vH; varying vec3 vW; void main() { vec3 p = position; float h = p.y; p.x *= 1. - .8 * h; vec4 o = instanceMatrix * vec4(0., 0., 0., 1.); float ph = o.x * 1.3 + o.z;
      vec4 w = modelMatrix * instanceMatrix * vec4(p, 1.); w.x += sin(uTime * .7 + ph + h * 3.) * 1.3 * h * h; w.z += cos(uTime * .5 + ph + h * 2.) * .9 * h * h; vH = h; vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: WATER + `varying float vH; varying vec3 vW; void main() { gl_FragColor = vec4(fog(mix(vec3(.01, .09, .08), vec3(.06, .36, .25), vH), vW), 1.); }` }), KN);
  const M = new THREE.Matrix4(), Q = new THREE.Quaternion(), Y = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < KN; i++) { const a = i * 2.399, r = R + 3 + ((i * 37) % 23), h = 5 + ((i * 53) % 11);
    M.compose(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r), Q.setFromAxisAngle(Y, a * 3), new THREE.Vector3(1.1 + (i % 3) * .4, h, 1)); kelp.setMatrixAt(i, M); }
  kelp.frustumCulled = false; s.add(kelp);
  // drifting specks
  const snow = pointCloud(500, { drift: .35 });
  for (let i = 0; i < 500; i++) { const a = Math.random() * 6.283, r = Math.sqrt(Math.random()) * 46;
    snow.geometry.attributes.position.setXYZ(i, Math.cos(a) * r, Math.random() * H, Math.sin(a) * r); snow.geometry.attributes.aSize.setX(i, .12 + Math.random() * .22); snow.geometry.attributes.aCol.setXYZW(i, .7, .95, 1, .3); }

  /* the games */
  const played = g => (g.hours || 0) > 0 || g.trophies_earned > 0;
  const all = DATA.games.map((g, i) => {
    const mk = Object.keys(g.months || {}).sort(), genre = mainGenre(g), gi = genres.indexOf(genre);
    const a = i * 2.39996 + hash(g.name) * .5, r = 2 + Math.sqrt((i + .5) / DATA.games.length) * (R * Math.min(2.1, Math.max(1, camera.aspect * 1.25)) + 7);
    const o = { g, name: g.name, genre, gi, col: new THREE.Color(gi < 0 ? OOTHER : OCOL[gi]), ex: Math.cos(a) * r, ez: Math.sin(a) * r, acquired: ms(g.acquired) };
    if (!played(g)) { o.from = o.acquired ?? 0; o.until = Infinity; return o; }
    o.birth = ms(g.first_played) ?? ms(g.first_trophy_at) ?? (mk[0] ? ms(mk[0] + "-01") : null) ?? o.acquired ?? now;
    o.last = Math.max(o.birth, ms(g.last_played) || 0, ms(g.last_trophy) || 0);
    o.hours = g.hours || Math.min(40, (g.trophies_earned || 0) * .6) || 1; o.guess = !g.hours;
    const hy = Object.entries(g.hours_by_year || {}).map(([y, h]) => [+y, h]).filter(e => e[1] > 0).sort((p, q) => p[0] - q[0]), sum = hy.reduce((n, e) => n + e[1], 0);
    o.hy = sum ? hy.map(([y, h]) => [y, h * o.hours / sum]) : null;

function drawPrint(x, W, H, opt = {}) {
  const P = FP_PAL[opt.style || fp.style], prog = opt.progress ?? 1, poster = !!opt.poster;
  const top = opt.top ?? 0, bottom = opt.bottom ?? 0, cx = W / 2, cy = top + (H - top - bottom) / 2;
  const R = Math.min(W * 0.44, (H - top - bottom) * 0.44), r0 = R * 0.12, ring = (R - r0) / fp.turns, s = R / 400;   // s: scale for strokes and dots
  const at = (p, off = 0) => { const a = (p % 1) * Math.PI * 2 - Math.PI / 2, r = r0 + p * ring + off * ring * 0.62; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  const until = fp.yearPos(fp.t0.getTime() + prog * fp.total * 36e5);
  if (poster || (opt.style || fp.style) === "night") { x.fillStyle = P.bg; x.fillRect(0, 0, W, H); }
  else {                       // on screen, the paper version is a sheet on the dark page
    x.fillStyle = FP_PAL.night.bg; x.fillRect(0, 0, W, H);
    const pad = 10, side = Math.min(W - 2 * pad, H - top - bottom - 2 * pad);

  for (let p = 0; p <= fp.turns; p += 0.004) { const [px, py] = at(p); p ? x.lineTo(px, py) : x.moveTo(px, py); } x.stroke();
  x.fillStyle = P.soft; x.font = `600 ${Math.max(9, 11 * s)}px "Barlow Condensed", sans-serif`; x.textAlign = "center";
  const every = fp.turns > 12 ? 5 : fp.turns > 6 ? 2 : 1;
  for (let y = 0; y < fp.turns; y++) if ((fp.y0 + y) % every === 0 || y === 0 || y === fp.turns - 1) { const [px, py] = at(y, -0.5); x.fillText(String(fp.y0 + y), px, py - 2 * s); }
  // months around the outside
  ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"].forEach((m, i) => { const a = (i + 0.5) / 12 * Math.PI * 2 - Math.PI / 2, r = R + 16 * s;
    x.fillText(m, cx + Math.cos(a) * r, cy + Math.sin(a) * r + 4 * s); });

  x.globalCompositeOperation = P.mode; x.lineCap = "round";
  fp.games.forEach(o => {
    const col = o.ci >= 0 ? P.cols[o.ci] : P.other;
    o.spells.forEach(sp => { if (sp.a > until) return; const b = Math.min(sp.b, until), span = Math.max(0.002, b - sp.a);
      x.strokeStyle = col; x.globalAlpha = 0.5; x.lineWidth = Math.min(7, 1 + 6 * Math.sqrt(sp.n / (span * 365 + 3)) ) * s * 1.6;
      x.beginPath(); for (let p = sp.a, k = 0; p <= b + 1e-6; p += Math.min(0.003, span / 2), k++) { const [px, py] = at(p, o.off); k ? x.lineTo(px, py) : x.moveTo(px, py); } x.stroke(); });
    x.fillStyle = col;
    o.pts.forEach(pt => { if (pt.p > until || pt.grade === 3) return; const [px, py] = at(pt.p, o.off);
      x.globalAlpha = 0.85; x.beginPath(); x.arc(px, py, ([0.9, 1.2, 1.7][pt.grade] + (pt.rare && pt.rare < 5 ? 0.9 : 0)) * s * 1.5, 0, 7); x.fill(); });
  });
  x.globalAlpha = 1; x.globalCompositeOperation = "source-over";
  // platinums: four-pointed stars with a soft glow
  fp.games.forEach(o => o.pts.forEach(pt => { if (pt.grade !== 3 || pt.p > until) return; const [px, py] = at(pt.p, o.off), k = 9 * s;
    const g = x.createRadialGradient(px, py, 0, px, py, k * 2.2); g.addColorStop(0, P.plat); g.addColorStop(1, "transparent");
    x.globalAlpha = 0.55; x.fillStyle = g; x.beginPath(); x.arc(px, py, k * 2.2, 0, 7); x.fill(); x.globalAlpha = 1;
    x.fillStyle = P.plat; x.beginPath(); for (let j = 0; j < 8; j++) { const a = j * Math.PI / 4, rr = j % 2 ? k * 0.28 : k; x.lineTo(px + Math.cos(a) * rr, py + Math.sin(a) * rr); } x.closePath(); x.fill(); }));
  // the needle: where the sweep is now
  if (prog < 1) { const [px, py] = at(until); x.fillStyle = P.ink; x.beginPath(); x.arc(px, py, 3.5 * s, 0, 7); x.fill(); }
  // centre label
  x.fillStyle = P.ink; x.textAlign = "center"; x.font = `700 ${22 * s}px "Barlow Condensed", sans-serif`;
  x.fillText(DATA.profile?.online_id || "", cx, cy + 7 * s);
  if (poster) {           // title block for the printed version
    const m = W * 0.07, ty = H - bottom + bottom * 0.18;
    x.textAlign = "left"; x.fillStyle = P.ink; x.font = `800 ${W * 0.075}px "Barlow Condensed", sans-serif`;
    x.fillText(`${DATA.profile?.online_id || "My"} · ${fp.y0}–${fp.y1}`, m, top * 0.62);
    x.fillStyle = P.soft; x.font = `500 ${W * 0.022}px "IBM Plex Sans", sans-serif`;
    x.fillText("A fingerprint of every trophy I've earned on PlayStation. One turn of the spiral is one year.", m, top * 0.62 + W * 0.04);
    const tot = DATA.games.reduce((a, g) => a + (g.hours || 0), 0), plats = GAL.t.filter(r => r[1] === 3).length;
    const figs = [[GAL.t.length.toLocaleString(), "trophies"], [String(plats), "platinums"], [Math.round(tot).toLocaleString(), "hours"], [String(fp.games.length), "games"]];
    figs.forEach(([v, l], i) => { const fx = m + i * (W - 2 * m) / 4; x.fillStyle = P.ink; x.font = `700 ${W * 0.055}px "Barlow Condensed", sans-serif`; x.fillText(v, fx, ty + W * 0.05);
      x.fillStyle = P.soft; x.font = `500 ${W * 0.018}px "IBM Plex Sans", sans-serif`; x.fillText(l, fx, ty + W * 0.075); });
    let lx = m, ly = ty + W * 0.13; x.font = `500 ${W * 0.017}px "IBM Plex Sans", sans-serif`;
    fp.genres.forEach((g, i) => { const w = x.measureText(g).width + W * 0.05; if (lx + w > W - m) { lx = m; ly += W * 0.035; }
      x.fillStyle = P.cols[i]; x.beginPath(); x.arc(lx + W * 0.008, ly - W * 0.006, W * 0.007, 0, 7); x.fill(); x.fillStyle = P.ink; x.fillText(g, lx + W * 0.022, ly); lx += w; });
    x.fillStyle = P.soft; x.font = `500 ${W * 0.015}px "IBM Plex Sans", sans-serif`; x.textAlign = "right"; x.fillText("Game Shelf", W - m, H - m * 0.6);
  }
}
const fpCanvas = $("fp"), fpCtx = fpCanvas.getContext("2d");
function renderPrint() {
  const d = Math.min(devicePixelRatio, 2), W = innerWidth, H = innerHeight;
  if (fpCanvas.width !== Math.round(W * d)) { fpCanvas.width = Math.round(W * d); fpCanvas.height = Math.round(H * d); }
  fpCtx.setTransform(d, 0, 0, d, 0, 0);
  const top = document.querySelector("header").getBoundingClientRect().bottom, bottom = H - document.querySelector("footer").getBoundingClientRect().top;
  fp.box = { top, bottom }; drawPrint(fpCtx, W, H, { progress: fp.progress, top, bottom });
}
function pickPrint(ev) {
  const W = innerWidth, H = innerHeight, { top, bottom } = fp.box, cx = W / 2, cy = top + (H - top - bottom) / 2, R = Math.min(W * 0.44, (H - top - bottom) * 0.44), r0 = R * 0.12, ring = (R - r0) / fp.turns;
  let best = null, bd = 24 * 24;
  fp.games.forEach(o => o.pts.forEach(pt => { const a = (pt.p % 1) * Math.PI * 2 - Math.PI / 2, r = r0 + pt.p * ring + o.off * ring * 0.62;
    const dx = cx + Math.cos(a) * r - ev.clientX, dy = cy + Math.sin(a) * r - ev.clientY, dd = dx * dx + dy * dy - (pt.grade === 3 ? 200 : 0);
    if (dd < bd) { bd = dd; best = [o, pt]; } }));
  if (!best) return;
  const [o, pt] = best;
  info(o.g?.image ? `<img src="${esc(o.g.image)}" alt="">` : "✦", pt.n || o.name, `${GRADE[pt.grade]} · ${o.name} · ${fmtDate(new Date(pt.ms))}${pt.rare ? ` · ${pt.rare}%` : ""} · ${o.g ? fp.mainGenre(o.g) : ""}`);
}
async function savePoster() {
  const btn = $("fpSave"); btn.disabled = true; btn.textContent = "Preparing…";
  try { await Promise.all(['800 80px "Barlow Condensed"', '500 20px "IBM Plex Sans"'].map(f => document.fonts.load(f))); } catch {}
  const W = 2480, H = 3508, c = document.createElement("canvas"); c.width = W; c.height = H;        // A4 at 300 dpi, scales to A2/A1
  drawPrint(c.getContext("2d"), W, H, { poster: true, top: H * 0.13, bottom: H * 0.2, progress: 1 });
  const blob = await new Promise(r => c.toBlob(r, "image/png")), name = `gamer-fingerprint-${fp.style}.png`;
  try {
    const file = new File([blob], name, { type: "image/png" });
    if (navigator.canShare?.({ files: [file] })) await navigator.share({ files: [file], title: "My gamer fingerprint" });
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
  } catch {}

/* ---------- 3. Hours race: your top 10 games by hours, year by year ---------- */
const race = { t: 1, playing: false };
function buildRace() {
  const games = DATA.games.filter(g => g.hours_by_year && Object.keys(g.hours_by_year).length && (g.has_trophies || g.rawg_slug));
  const ys = games.flatMap(g => Object.keys(g.hours_by_year).map(Number)); race.y0 = Math.min(...ys); race.y1 = Math.max(...ys);
  race.games = games.map(g => { const cum = {}; let s = 0; for (let y = race.y0; y <= race.y1; y++) { s += g.hours_by_year[y] || 0; cum[y] = s; } return { g, cum }; });
  const hue = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
  race.el = new Map();
  race.games.forEach(o => { const d = document.createElement("div"); d.className = "rbar"; d.style.opacity = 0;
    d.innerHTML = `<span class="c">${o.g.image ? `<img src="${esc(o.g.image)}" alt="" loading="lazy">` : initials(o.g.name)}</span><span class="track"><span class="fill" style="background:hsl(${hue(o.g.name)} 65% 52%)"></span><span class="lab">${esc(o.g.name)}</span><span class="val"></span></span>`;
    $("race").appendChild(d); race.el.set(o, d); });
}
function drawRace(p) {
  race.t = p; const yf = race.y0 + p * (race.y1 - race.y0 + 0.999), y = Math.floor(yf), fr = yf - y;
  const val = o => (o.cum[y - 1] || 0) + ((o.cum[y] || 0) - (o.cum[y - 1] || 0)) * fr;
  const ranked = race.games.map(o => [o, val(o)]).sort((a, b) => b[1] - a[1]), top = ranked.slice(0, 10), max = Math.max(1, top[0][1]);
  const H = Math.min(46, ($("race").clientHeight - 20) / 10);
  ranked.forEach(([o, v], i) => { const d = race.el.get(o), on = i < 10 && v > 0;
    d.style.opacity = on ? 1 : 0; d.style.transform = `translateY(${(on ? i : 10.5) * H}px)`;
    if (on) { d.querySelector(".fill").style.width = `${Math.max(4, 100 * v / max)}%`; d.querySelector(".val").textContent = `${Math.round(v)} h`; } });
  $("raceYear").textContent = y; $("yr").textContent = y;
}

/* ---------- switching views, timeline, animation loop ---------- */
function setView(v) {
  view = v;
  document.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  $("race").classList.toggle("on", v === "race"); canvas.style.visibility = v === "ocean" ? "visible" : "hidden"; $("labels").innerHTML = "";
  $("fp").classList.toggle("on", v === "print"); $("fpTools").hidden = v !== "print";
  if (v === "ocean") { ocean.follow = null; const d = oceanHome(); controls.target.copy(CENTRE); camera.position.set(0, CENTRE.y + d * Math.cos(1.5), d * Math.sin(1.5));
    $("legend").innerHTML = ocean.legend; oceanInfo(); play(); }
  if (v === "print") { $("legend").innerHTML = fp.legendHTML();
    info("✦", "Your gamer fingerprint", "One turn of the spiral is one year, from your first trophy in the centre. Threads are games (colour = genre), dots are trophies, stars are platinums. Tap one."); play(); }
  if (v === "race") { $("legend").innerHTML = `<span>Total hours per game, year after year</span>`; info("🏁", "Hours race", "Which games took most of your time, and when."); play(); }
  controls?.update();
}
document.querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b && b.dataset.v !== view) setView(b.dataset.v); });
let anim = null;
function play() {                          // replay the current view from the start (instantly with "reduce motion")
  const dur = view === "ocean" ? 24000 : view === "print" ? 8000 : Math.max(20000, (race.y1 - race.y0 + 1) * 2600);   // the race: about 2.6 s a year
  if (calm) { setProgress(1); return; }
  const t0 = performance.now(); anim = { t0, dur };
}
function setProgress(p) {
  p = Math.max(0, Math.min(1, p)); $("scrub").value = Math.round(p * 1000);
  if (view === "ocean" && ocean.mesh) { ocean.quick = .6; oceanTime(p); }
  if (view === "print" && fp.games) { fp.progress = p; renderPrint(); $("yr").textContent = new Date(fp.t0.getTime() + p * fp.total * 36e5).getFullYear(); }
  if (view === "race" && race.games) drawRace(p);
}
$("play").onclick = () => play();
$("scrub").addEventListener("input", e => { anim = null; setProgress(e.target.value / 1000); });
let down = null;
canvas.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
canvas.addEventListener("pointerup", e => { if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 6) pickOcean(e); down = null; });
$("fp").addEventListener("click", pickPrint);
$("fpTools").addEventListener("click", e => { const b = e.target.closest("[data-style]"); if (b) { fp.style = b.dataset.style;
  document.querySelectorAll("[data-style]").forEach(x => x.setAttribute("aria-pressed", x === b)); $("legend").innerHTML = fp.legendHTML(); renderPrint(); }
  if (e.target.id === "fpSave") savePoster(); });
addEventListener("resize", () => view === "print" && renderPrint());

const tmpM = new THREE.Matrix4(), tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3();
function labels(list) {
  const top = document.querySelector("header").getBoundingClientRect().bottom + 8, bottom = document.querySelector("footer").getBoundingClientRect().top - 8;
  $("labels").innerHTML = list.map(l => { tmpV.copy(l.p).project(camera); if (tmpV.z > 1 || Math.abs(tmpV.x) > 1.1 || Math.abs(tmpV.y) > 1.1) return "";
    const py = (1 - tmpV.y) / 2 * innerHeight; if (py < top || py > bottom) return "";
    return `<span class="${l.big ? "big" : l.edge ? "edge" : ""}" style="left:${l.edge ? 14 : (tmpV.x + 1) / 2 * innerWidth}px;top:${(1 - tmpV.y) / 2 * innerHeight}px">${l.text}</span>`; }).join("");
}
function loop() {
  requestAnimationFrame(loop);
  if (anim) { const p = Math.min(1, (performance.now() - anim.t0) / anim.dur); setProgress(p); if (p >= 1) anim = null; }
  if (!renderer || view !== "ocean") return;
  const dt = Math.min(.05, clock.getDelta()) * (calm ? .3 : 1);
  U.uTime.value += dt; swim(dt); oceanCamera(dt); controls.update();
  renderer.render(ocean.scene, camera); oceanLabels();
}

async function start() {
  const get = async (f, d) => { try { const r = await fetch(f, { cache: "no-store" }); return r.ok ? await r.json() : d; } catch { return d; } };
  [DATA, GAL, FLAGS] = await Promise.all([get("data.json", null), get("galaxy.json", null), get("flags.json", {})]);
  if (!DATA) { info("⚠️", "No game data yet", ""); return; }
  buildRace();
  if (!renderer) { document.querySelector('[data-v="ocean"]').disabled = true; if (GAL?.t?.length) buildPrint(); setView(GAL?.t?.length ? "print" : "race"); info("ℹ️", "3D isn't available on this device", "The hours race still works."); loop(); return; }
  resize();
  buildOcean(); resize();
  if (GAL?.t?.length) buildPrint(); else document.querySelector('[data-v="print"]').hidden = true;
  document.fonts?.ready.then(() => view === "print" && renderPrint());
  const want = location.hash.slice(1);
  setView(["print", "race"].includes(want) && (want === "race" || GAL?.t?.length) ? want : "ocean");
  loop();
}
start();
