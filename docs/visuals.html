<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Game Shelf">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Three animated views of your history: Trophy galaxy (every trophy a star), Activity landscape (a mountain range of your weeks), Hours race. */
:root { --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "IBM Plex Sans", system-ui, sans-serif; --ink: #eef2ff; --soft: rgba(238,242,255,.66);
  --safe-top: env(safe-area-inset-top, 0px); --safe-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #05070f; color: var(--ink); font-family: var(--body); overflow: hidden; -webkit-font-smoothing: antialiased; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
header { position: fixed; top: 0; left: 0; right: 0; z-index: 5; padding: calc(10px + var(--safe-top)) 14px 10px; display: grid; gap: 10px;
  background: linear-gradient(#05070fdd, #05070f00); pointer-events: none; }
header > * { pointer-events: auto; }
.row { display: flex; align-items: center; gap: 10px; }
.back { color: var(--ink); text-decoration: none; background: rgba(255,255,255,.1); border-radius: 999px; min-height: 40px; padding: 0 14px; display: inline-flex; align-items: center; font-weight: 600; }
h1 { font: 700 26px var(--display); margin: 0; flex: 1; letter-spacing: .01em; }
.seg { display: flex; background: rgba(255,255,255,.08); border-radius: 999px; padding: 3px; gap: 2px; width: max-content; max-width: 100%; }
.seg button { border: 0; background: none; color: var(--soft); font: 600 15px var(--body); padding: 8px 14px; border-radius: 999px; min-height: 40px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #05070f; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--soft); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; vertical-align: 0; }
.labels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.labels span { position: absolute; transform: translate(-50%, -50%); font: 600 13px var(--display); letter-spacing: .06em; color: rgba(238,242,255,.55); white-space: nowrap; text-shadow: 0 1px 6px #000; }
.labels span.big { font-size: 15px; color: rgba(238,242,255,.8); }
footer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 14px calc(12px + var(--safe-bottom)); display: grid; gap: 10px;
  background: linear-gradient(#05070f00, #05070fee 40%); }
.info { min-height: 58px; display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px;
  background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.info .ic { width: 44px; height: 44px; border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.1); display: grid; place-items: center; font-size: 22px; }
.info .ic img { width: 100%; height: 100%; object-fit: cover; }
.info b { display: block; font: 600 17px/1.2 var(--body); }
.info small { color: var(--soft); font-size: 13.5px; }
.controls { display: flex; align-items: center; gap: 10px; }
.controls button { background: var(--ink); color: #05070f; border: 0; border-radius: 999px; min-width: 44px; min-height: 44px; font: 700 16px var(--body); cursor: pointer; padding: 0 14px; }
.controls input[type=range] { flex: 1; accent-color: #9fc4ff; height: 32px; }
.controls .yr { font: 700 30px var(--display); min-width: 64px; text-align: right; }
/* Hours race (DOM bars) */
#race { position: fixed; left: 0; right: 0; top: calc(130px + var(--safe-top)); bottom: calc(150px + var(--safe-bottom)); padding: 0 14px; z-index: 3; display: none; }
#race.on { display: block; }
.rbar { position: absolute; left: 14px; right: 14px; height: 40px; display: grid; grid-template-columns: 40px 1fr; gap: 8px; align-items: center; transition: transform .8s ease, opacity .8s; will-change: transform; }
.rbar .c { width: 40px; height: 40px; border-radius: 8px; overflow: hidden; background: rgba(255,255,255,.1); display: grid; place-items: center; font: 600 13px var(--display); }
.rbar .c img { width: 100%; height: 100%; object-fit: cover; }
.rbar .track { position: relative; height: 32px; }
.rbar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 8px; transition: width .6s linear; min-width: 4px; }
.rbar .lab { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font: 600 14px var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100% - 70px); text-shadow: 0 1px 4px rgba(0,0,0,.6); }
.rbar .val { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font: 700 18px var(--display); }
.racebg { position: absolute; right: 14px; bottom: 0; font: 800 120px/1 var(--display); color: rgba(238,242,255,.08); pointer-events: none; }
.note { color: var(--soft); font-size: 13px; text-align: center; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (min-width: 900px) { header, footer { max-width: 720px; margin: 0 auto; } }
</style>

<main>
  <canvas id="gl" aria-label="3D view of your games and trophies" role="img"></canvas>
  <div class="labels" id="labels" aria-hidden="true"></div>
  <header>
    <div class="row"><a class="back" href="stats.html" aria-label="Back to Stats">‹ Stats</a><h1>Your history in 3D</h1></div>
    <div class="seg" role="group" aria-label="View"><button data-v="galaxy" aria-pressed="true">Trophy galaxy</button><button data-v="land">Landscape</button><button data-v="race">Hours race</button></div>
    <div class="legend" id="legend"></div>
  </header>
  <section id="race" aria-label="Hours race"><div class="racebg" id="raceYear"></div></section>
  <footer>
    <div class="info" id="info" aria-live="polite"><span class="ic">✨</span><span><b id="infoT">Loading…</b><small id="infoS"></small></span></div>
    <div class="controls" id="controls"><button id="play" aria-label="Replay">↺</button><input type="range" id="scrub" min="0" max="1000" value="1000" aria-label="Timeline"><span class="yr" id="yr"></span></div>
  </footer>
</main>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
const fmtDate = d => d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
const info = (icon, title, sub) => { $("info").querySelector(".ic").innerHTML = icon; $("infoT").textContent = title; $("infoS").textContent = sub || ""; };
const GRADE = ["Bronze", "Silver", "Gold", "Platinum"], GCOL = ["#d08c5c", "#c9d4e6", "#ffcf4a", "#8fd0ff"];
let DATA, GAL, FLAGS = {}, view = "galaxy";

/* ---------- renderer, camera, controls (shared by the galaxy and the landscape) ---------- */
const canvas = $("gl");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" }); }
catch { renderer = null; }
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
const controls = renderer ? new OrbitControls(camera, canvas) : null;
if (controls) { controls.enableDamping = true; controls.dampingFactor = 0.08; controls.autoRotate = !calm; controls.autoRotateSpeed = 0.35; controls.enablePan = false; }
const clock = new THREE.Clock();
function resize() {
  if (!renderer) return;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

/* ---------- 1. Trophy galaxy: every trophy a star, spiralling out from your first one ---------- */
function soft() {                                   // round glowing sprite for the stars
  const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d");
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, "rgba(255,255,255,1)"); g.addColorStop(.25, "rgba(255,255,255,.85)"); g.addColorStop(1, "rgba(255,255,255,0)");
  x.fillStyle = g; x.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c);
}
const galaxy = { scene: new THREE.Scene(), progress: 1, playing: false, rows: [], years: [] };
function buildGalaxy() {
  const s = galaxy.scene, rows = GAL.t, n = rows.length, total = rows[n - 1][0] || 1, t0 = new Date(GAL.start);
  s.fog = new THREE.FogExp2(0x05070f, 0.0065);
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), size = new Float32Array(n), born = new Float32Array(n);
  const turns = 2.4;          // a loose spiral with two arms reads better than one turn per year
  const rnd = (i, k) => { const v = Math.sin(i * 12.9898 + k * 78.233) * 43758.5453; return v - Math.floor(v); };   // stable jitter
  const gauss = (i, k) => (rnd(i, k) + rnd(i, k + 1) + rnd(i, k + 2) - 1.5) * 1.15;
  rows.forEach((r, i) => {
    const f = r[0] / total, ang = f * turns * Math.PI * 2 + (r[3] % 2) * Math.PI, rad = 4 + 46 * Math.pow(f, 0.85);
    const spread = 0.7 + rad * 0.045;
    pos[i * 3] = Math.cos(ang) * rad + gauss(i, 1) * spread;
    pos[i * 3 + 1] = gauss(i, 5) * (1.6 - f) * 1.3 + (r[1] === 3 ? 0 : 0);
    pos[i * 3 + 2] = Math.sin(ang) * rad + gauss(i, 9) * spread;
    const c = new THREE.Color(GCOL[r[1]]); col.set([c.r, c.g, c.b], i * 3);
    const rare = r[2] / 10;
    size[i] = [1.1, 1.4, 1.9, 6.5][r[1]] * (rare && rare < 5 ? 1.6 : rare < 15 ? 1.2 : 1);
    born[i] = f;
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3)); geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  geo.setAttribute("size", new THREE.BufferAttribute(size, 1)); geo.setAttribute("born", new THREE.BufferAttribute(born, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { uMap: { value: soft() }, uProgress: { value: 1 }, uTime: { value: 0 }, uPx: { value: renderer.getPixelRatio() } },
    vertexShader: `attribute float size; attribute float born; attribute vec3 color; varying vec3 vColor; varying float vAlpha;
      uniform float uProgress, uTime, uPx;
      void main() {
        float age = uProgress - born; float on = smoothstep(0.0, 0.015, age);
        float tw = 0.82 + 0.18 * sin(uTime * 2.0 + position.x * 3.1 + position.z * 1.7);
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        float flash = 1.0 + 2.5 * (1.0 - smoothstep(0.0, 0.02, age)) * step(0.0, age);
        gl_PointSize = size * on * flash * uPx * (380.0 / -mv.z);
        vColor = color; vAlpha = on * tw; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform sampler2D uMap; varying vec3 vColor; varying float vAlpha;
      void main() { vec4 t = texture2D(uMap, gl_PointCoord); gl_FragColor = vec4(vColor, t.a * vAlpha); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  galaxy.points = new THREE.Points(geo, mat); s.add(galaxy.points);
  galaxy.mat = mat; galaxy.total = total; galaxy.turns = turns; galaxy.t0 = t0;
  // a faint dust of background stars and a warm core
  const bg = new Float32Array(1500 * 3); for (let i = 0; i < 1500; i++) { const r = 300 + rnd(i, 21) * 500, a = rnd(i, 22) * Math.PI * 2, b = Math.acos(2 * rnd(i, 23) - 1);
    bg.set([r * Math.sin(b) * Math.cos(a), r * Math.cos(b), r * Math.sin(b) * Math.sin(a)], i * 3); }
  const bgg = new THREE.BufferGeometry(); bgg.setAttribute("position", new THREE.BufferAttribute(bg, 3));
  s.add(new THREE.Points(bgg, new THREE.PointsMaterial({ size: 1.4, color: 0x8899cc, transparent: true, opacity: .55, sizeAttenuation: false })));
  const core = new THREE.Sprite(new THREE.SpriteMaterial({ map: soft(), color: 0xffd9a0, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false }));
  core.scale.set(16, 16, 1); core.material.opacity = .4; s.add(core);
  // where each year starts, for the floating labels
  const y0 = t0.getFullYear();
  for (let y = y0 + 1; y <= new Date().getFullYear(); y++) {
    const f = (new Date(y, 0, 1) - t0) / 36e5 / total; if (f <= 0 || f >= 1) continue;
    const ang = f * turns * Math.PI * 2 + Math.PI / 2, rad = 4 + 46 * Math.pow(f, 0.85);
    galaxy.years.push({ y, f, p: new THREE.Vector3(Math.cos(ang) * rad, 3, Math.sin(ang) * rad) });
  }
  const plats = rows.filter(r => r[1] === 3).length;
  galaxy.legend = GRADE.map((g, i) => `<span><i style="background:${GCOL[i]}"></i>${g}</span>`).join("") + `<span>${n.toLocaleString()} trophies · ${plats} platinums · bigger = rarer</span>`;
}
function galaxyYear(p) { const h = p * galaxy.total; return new Date(galaxy.t0.getTime() + h * 36e5).getFullYear(); }
function pickGalaxy(ev) {
  const r = canvas.getBoundingClientRect(), m = new THREE.Vector2(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  const pos = galaxy.points.geometry.attributes.position, v = new THREE.Vector3();
  let best = -1, bd = 26 * 26;                                  // nearest star on screen within ~26px, platinums and rare ones first
  for (let i = 0; i < pos.count; i++) {
    if (GAL.t[i][0] / galaxy.total > galaxy.progress) continue;
    v.fromBufferAttribute(pos, i).project(camera); if (v.z > 1) continue;
    const dx = (v.x - m.x) * r.width / 2, dy = (v.y - m.y) * r.height / 2, d = dx * dx + dy * dy - (GAL.t[i][1] === 3 ? 300 : GAL.t[i][4] ? 80 : 0);
    if (d < bd) { bd = d; best = i; }
  }
  if (best < 0) return;
  const t = GAL.t[best], g = DATA.games.find(x => x.name === GAL.games[t[3]]), when = new Date(galaxy.t0.getTime() + t[0] * 36e5);
  info(g?.image ? `<img src="${esc(g.image)}" alt="">` : "🏆", t[4] || `${GRADE[t[1]]} trophy`, `${GRADE[t[1]]} · ${GAL.games[t[3]] || ""} · ${fmtDate(when)}${t[2] ? ` · ${t[2] / 10}% of players` : ""}`);
}

/* ---------- 2. Activity landscape: a mountain range of your play, one ridge per year, one column per week ---------- */
const land = { scene: new THREE.Scene(), grow: 1, labels: [] };
const WEEKS = 53, SUB = 6;                       // terrain rows between two years, for smooth valleys
function buildLand() {
  const s = land.scene; s.background = new THREE.Color(0x05070f); s.fog = new THREE.Fog(0x05070f, 70, 170);
  const t0 = new Date(GAL.start), y0 = t0.getFullYear(), y1 = new Date().getFullYear(), NY = y1 - y0 + 1;
  // trophies per week per year, and which game led each week
  const grid = Array.from({ length: NY }, () => new Float32Array(WEEKS)), lead = Array.from({ length: NY }, () => Array.from({ length: WEEKS }, () => ({})));
  GAL.t.forEach(r => { const d = new Date(t0.getTime() + r[0] * 36e5), yi = d.getFullYear() - y0, w = Math.min(WEEKS - 1, Math.floor((d - new Date(d.getFullYear(), 0, 1)) / (7 * 864e5)));
    grid[yi][w]++; const L = lead[yi][w]; L[r[3]] = (L[r[3]] || 0) + 1; });
  const max = Math.max(1, ...grid.flatMap(r => [...r]));
  const W = 64, D = Math.max(40, NY * 5.2), cols = WEEKS * 2, rows = (NY - 1) * SUB || 1;
  const geo = new THREE.PlaneGeometry(W, D, cols, rows); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, base = new Float32Array(pos.count), col = new Float32Array(pos.count * 3), rowOf = new Float32Array(pos.count);
  const sample = (yf, wf) => {                       // smooth (bilinear, lightly blurred) height at a fractional year/week
    const yA = Math.floor(yf), yB = Math.min(NY - 1, yA + 1), fy = yf - yA, wA = Math.floor(wf), wB = Math.min(WEEKS - 1, wA + 1), fw = wf - wA;
    const g = (y, w) => { let v = 0, n = 0; for (let k = -1; k <= 1; k++) { const ww = w + k; if (ww >= 0 && ww < WEEKS) { v += grid[y][ww] * (k ? 0.5 : 1); n += k ? 0.5 : 1; } } return v / n; };
    return (g(yA, wA) * (1 - fw) + g(yA, wB) * fw) * (1 - fy) + (g(yB, wA) * (1 - fw) + g(yB, wB) * fw) * fy;
  };
  const ramp = [[0, "#141c3d"], [0.08, "#2b3a8f"], [0.25, "#7b3fd1"], [0.5, "#e2557a"], [0.75, "#ff9a3c"], [1, "#ffe08a"]].map(([k, c]) => [k, new THREE.Color(c)]);
  const colorAt = t => { for (let i = 1; i < ramp.length; i++) if (t <= ramp[i][0]) return ramp[i - 1][1].clone().lerp(ramp[i][1], (t - ramp[i - 1][0]) / (ramp[i][0] - ramp[i - 1][0])); return ramp.at(-1)[1].clone(); };
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i), wf = (x / W + 0.5) * (WEEKS - 1), yf = (z / D + 0.5) * (NY - 1);   // front = latest year, back = your first
    const yr = yf, v = sample(Math.max(0, Math.min(NY - 1, yr)), Math.max(0, Math.min(WEEKS - 1, wf)));
    const h = Math.pow(v / max, 0.6) * 12; base[i] = h; rowOf[i] = yr;
    const c = colorAt(Math.pow(v / max, 0.6)); col.set([c.r, c.g, c.b], i * 3); pos.setY(i, 0);
  }
  geo.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.75, metalness: 0.05, flatShading: true, side: THREE.DoubleSide }));
  const wire = new THREE.LineSegments(new THREE.WireframeGeometry(geo), new THREE.LineBasicMaterial({ color: 0x9fb4ff, transparent: true, opacity: 0.07 }));
  s.add(mesh, wire);
  s.add(new THREE.HemisphereLight(0xc8d6ff, 0x0a0d1a, 1.0));
  const key = new THREE.DirectionalLight(0xffe6c8, 1.8); key.position.set(-30, 40, 30); s.add(key);
  Object.assign(land, { mesh, wire, base, rowOf, NY, y0, W, D, grid, lead, max });
  for (let y = 0; y < NY; y++) land.labels.push({ text: y0 + y, p: new THREE.Vector3(-W * 0.3, 9, D * (y / Math.max(1, NY - 1) - 0.5)) });
  
  const busiest = grid.flatMap((r, y) => [...r].map((v, w) => [v, y, w])).sort((a, b) => b[0] - a[0])[0];
  land.legend = `<span><i style="background:#2b3a8f"></i>quiet</span><span><i style="background:#e2557a"></i>busy</span><span><i style="background:#ffe08a"></i>your peaks</span><span>height = trophies that week · busiest: ${busiest[0]} in a week of ${y0 + busiest[1]}</span>`;
}
function updateLand(p) {                          // the range rises year by year, oldest at the back
  const pos = land.mesh.geometry.attributes.position, NY = land.NY;
  for (let i = 0; i < pos.count; i++) { const k = Math.min(1, Math.max(0, p * (NY + 2) - land.rowOf[i])); pos.setY(i, land.base[i] * (k * k * (3 - 2 * k))); }
  pos.needsUpdate = true; land.mesh.geometry.computeVertexNormals();
  land.wire.geometry.dispose(); land.wire.geometry = new THREE.WireframeGeometry(land.mesh.geometry);
}
function pickLand(ev) {
  const r = canvas.getBoundingClientRect(), ray = new THREE.Raycaster();
  ray.setFromCamera(new THREE.Vector2(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = ray.intersectObject(land.mesh)[0]; if (!hit) return;
  const w = Math.round((hit.point.x / land.W + 0.5) * (WEEKS - 1)), y = Math.round((hit.point.z / land.D + 0.5) * (land.NY - 1));
  if (y < 0 || y >= land.NY) return;
  const n = land.grid[y][w], top = Object.entries(land.lead[y][w]).sort((a, b) => b[1] - a[1])[0], g = top && DATA.games.find(x => x.name === GAL.games[top[0]]);
  const monday = new Date(land.y0 + y, 0, 1 + w * 7);
  info(g?.image ? `<img src="${esc(g.image)}" alt="">` : "⛰️", `Week of ${monday.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })}`,
    n ? `${n} troph${n > 1 ? "ies" : "y"}${top ? ` · mostly ${GAL.games[top[0]]}` : ""}` : "No trophies that week");
}

/* ---------- 3. Hours race: your top 10 games by hours, year by year ---------- */
const race = { t: 1, playing: false };
function buildRace() {
  const games = DATA.games.filter(g => g.hours_by_year && Object.keys(g.hours_by_year).length && (g.has_trophies || g.rawg_slug));
  const ys = games.flatMap(g => Object.keys(g.hours_by_year).map(Number)); race.y0 = Math.min(...ys); race.y1 = Math.max(...ys);
  race.games = games.map(g => { const cum = {}; let s = 0; for (let y = race.y0; y <= race.y1; y++) { s += g.hours_by_year[y] || 0; cum[y] = s; } return { g, cum }; });
  const hue = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
  race.el = new Map();
  race.games.forEach(o => { const d = document.createElement("div"); d.className = "rbar"; d.style.opacity = 0;
    d.innerHTML = `<span class="c">${o.g.image ? `<img src="${esc(o.g.image)}" alt="" loading="lazy">` : initials(o.g.name)}</span><span class="track"><span class="fill" style="background:hsl(${hue(o.g.name)} 65% 52%)"></span><span class="lab">${esc(o.g.name)}</span><span class="val"></span></span>`;
    $("race").appendChild(d); race.el.set(o, d); });
}
function drawRace(p) {
  race.t = p; const yf = race.y0 + p * (race.y1 - race.y0 + 0.999), y = Math.floor(yf), fr = yf - y;
  const val = o => (o.cum[y - 1] || 0) + ((o.cum[y] || 0) - (o.cum[y - 1] || 0)) * fr;
  const ranked = race.games.map(o => [o, val(o)]).sort((a, b) => b[1] - a[1]), top = ranked.slice(0, 10), max = Math.max(1, top[0][1]);
  const H = Math.min(46, ($("race").clientHeight - 20) / 10);
  ranked.forEach(([o, v], i) => { const d = race.el.get(o), on = i < 10 && v > 0;
    d.style.opacity = on ? 1 : 0; d.style.transform = `translateY(${(on ? i : 10.5) * H}px)`;
    if (on) { d.querySelector(".fill").style.width = `${Math.max(4, 100 * v / max)}%`; d.querySelector(".val").textContent = `${Math.round(v)} h`; } });
  $("raceYear").textContent = y; $("yr").textContent = y;
}

/* ---------- switching views, timeline, animation loop ---------- */
function fit(radius, tilt) {        // place the camera so a disc of this radius fills the screen width, seen from above at an angle
  const v = THREE.MathUtils.degToRad(camera.fov), h = 2 * Math.atan(Math.tan(v / 2) * camera.aspect);
  const d = radius / Math.tan(Math.min(v, h) / 2) * 1.05;
  camera.position.set(0, d * Math.sin(tilt), d * Math.cos(tilt));
}
function setView(v) {
  view = v;
  document.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v));
  $("race").classList.toggle("on", v === "race"); canvas.style.visibility = v === "race" ? "hidden" : "visible"; $("labels").innerHTML = "";
  if (v === "galaxy") { fit(40, 0.95); controls?.target.set(0, 0, 0); $("legend").innerHTML = galaxy.legend;
    info("✨", "Every trophy you've earned is a star", "From your first in the centre, spiralling out to today. Drag to turn, pinch to zoom, tap a star."); play(); }
  if (v === "land") { fit(land.W * 0.4, 0.78); camera.position.x = -6; land.scene.fog.near = camera.position.length() * 0.9; land.scene.fog.far = camera.position.length() * 2.4; controls?.target.set(0, 0, land.D * 0.12); $("legend").innerHTML = land.legend;
    info("⛰️", "Your play as a mountain range", "One ridge per year (your first at the back, this year in front), one column per week: the higher, the more trophies. Drag to turn, tap a peak."); play(); }
  if (v === "race") { $("legend").innerHTML = `<span>Total hours per game, year after year</span>`; info("🏁", "Hours race", "Which games took most of your time, and when."); play(); }
  controls?.update();
}
document.querySelector(".seg").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b && b.dataset.v !== view) setView(b.dataset.v); });
let anim = null;
function play() {                          // replay the current view from the start (instantly with "reduce motion")
  const dur = view === "galaxy" ? 9000 : view === "land" ? 6000 : Math.max(20000, (race.y1 - race.y0 + 1) * 2600);   // the race: about 2.6 s a year
  if (calm) { setProgress(1); return; }
  const t0 = performance.now(); anim = { t0, dur };
}
function setProgress(p) {
  p = Math.max(0, Math.min(1, p)); $("scrub").value = Math.round(p * 1000);
  if (view === "galaxy" && galaxy.mat) { galaxy.progress = p; galaxy.mat.uniforms.uProgress.value = p; $("yr").textContent = galaxyYear(p); }
  if (view === "land" && land.mesh) { land.grow = p; updateLand(p); $("yr").textContent = land.y0 + Math.min(land.NY - 1, Math.floor(p * land.NY)); }
  if (view === "race" && race.games) drawRace(p);
}
$("play").onclick = () => play();
$("scrub").addEventListener("input", e => { anim = null; setProgress(e.target.value / 1000); });
let down = null;
canvas.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
canvas.addEventListener("pointerup", e => { if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 6) (view === "galaxy" ? pickGalaxy : pickLand)(e); down = null; });

const tmpM = new THREE.Matrix4(), tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3();
function labels(list) {
  const top = document.querySelector("header").getBoundingClientRect().bottom + 8, bottom = document.querySelector("footer").getBoundingClientRect().top - 8;
  $("labels").innerHTML = list.map(l => { tmpV.copy(l.p).project(camera); if (tmpV.z > 1 || Math.abs(tmpV.x) > 1.1 || Math.abs(tmpV.y) > 1.1) return "";
    const py = (1 - tmpV.y) / 2 * innerHeight; if (py < top || py > bottom) return "";
    return `<span class="${l.big ? "big" : ""}" style="left:${(tmpV.x + 1) / 2 * innerWidth}px;top:${(1 - tmpV.y) / 2 * innerHeight}px">${l.text}</span>`; }).join("");
}
function loop() {
  requestAnimationFrame(loop);
  if (anim) { const p = Math.min(1, (performance.now() - anim.t0) / anim.dur); setProgress(view === "land" ? 1 - Math.pow(1 - p, 2) : p); if (p >= 1) anim = null; }
  if (!renderer || view === "race") return;
  const dt = clock.getDelta(); controls.update();
  if (view === "galaxy") {
    galaxy.mat.uniforms.uTime.value += dt;
    renderer.render(galaxy.scene, camera);
    labels(galaxy.years.filter(y => y.f <= galaxy.progress).map(y => ({ text: y.y, p: y.p })));
  } else {
    renderer.render(land.scene, camera);
    labels(land.labels);
  }
}

async function start() {
  const get = async (f, d) => { try { const r = await fetch(f, { cache: "no-store" }); return r.ok ? await r.json() : d; } catch { return d; } };
  [DATA, GAL, FLAGS] = await Promise.all([get("data.json", null), get("galaxy.json", null), get("flags.json", {})]);
  if (!DATA) { info("⚠️", "No game data yet", ""); return; }
  buildRace();
  if (!renderer) { document.querySelector('[data-v="galaxy"]').disabled = document.querySelector('[data-v="land"]').disabled = true; setView("race"); info("ℹ️", "3D isn't available on this device", "The hours race still works."); loop(); return; }
  resize();
  if (GAL?.t?.length) buildGalaxy(); else document.querySelector('[data-v="galaxy"]').hidden = true;
  if (GAL?.t?.length) buildLand(); else document.querySelector('[data-v="land"]').hidden = true;
  const want = location.hash.slice(1);
  setView(["galaxy", "land", "race"].includes(want) ? want : GAL?.t?.length ? "galaxy" : "race");
  loop();
}
start();
</script>
