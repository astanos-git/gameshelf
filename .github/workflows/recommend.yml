name: Weekly recommendations

# Every Monday early morning (Swiss time), or by hand from the Actions tab.
# By hand you can also run just one part: "coming-soon" refreshes Play next → Discover → Coming soon,
# "push-test" sends the Monday push to your phone again (marked as a test).
on:
  schedule:
    - cron: "7 4 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [full, coming-soon, push-test, difficulty]
        default: full
      minutes:
        description: "Difficulty only: how many minutes to spend (max 60)"
        type: string
        default: "55"

permissions:
  contents: write

concurrency:
  group: gameshelf-data
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MODE: ${{ inputs.mode || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh your data first
        if: env.MODE == 'full'
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python fetch.py
      - name: Pick this week's games and take the weekly snapshot
        if: env.MODE == 'full'
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python recommend.py
      - name: Coming soon and game details
        if: env.MODE == 'full' || env.MODE == 'coming-soon'
        continue-on-error: true
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python discover.py
      - name: Probe the guide sites
        if: env.MODE == 'difficulty'
        continue-on-error: true
        run: python difficulty.py --raw
      - name: Platinum difficulty from guide sites
        if: env.MODE == 'full' || env.MODE == 'difficulty'
        continue-on-error: true
        run: python difficulty.py --minutes ${{ env.MODE == 'difficulty' && inputs.minutes || '15' }}
      - name: Publish
        if: env.MODE != 'push-test'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/recommendations.json docs/snapshots.json docs/wishlist.json docs/upcoming.json docs/difficulty.json 2>/dev/null || true
          if [ -d docs/trophies ]; then git add docs/trophies; fi
          for f in rawg_cache.json trophy_dates.json hltb_cache.json wikipedia_cache.json trophy_groups.json wikidata_about.json title_map.json rawg_tags.json rawg_details.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -q -m "Weekly recommendations"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
      - name: Monday push to your phone
        if: env.MODE == 'full' || env.MODE == 'push-test'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify.py ${{ env.MODE == 'push-test' && '--test' || '' }}
