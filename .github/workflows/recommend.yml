name: Weekly recommendations

# Every Monday early morning (Swiss time), or by hand from the Actions tab.
# By hand you can also run just one part: "coming-soon" refreshes Play next → Discover → Coming soon,
# "push-test" sends the Monday push to your phone again (marked as a test).
on:
  schedule:
    - cron: "7 4 * * 1"
    # GitHub sometimes skips a scheduled run when it's busy: two back-up times later on Monday,
    # which do nothing if this week's run already happened
    - cron: "41 7 * * 1"
    - cron: "23 12 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [full, coming-soon, push-test, difficulty]
        default: full
      minutes:
        description: "Difficulty only: how many minutes to spend (max 60)"
        type: string
        default: "55"
      reparse:
        description: "Difficulty only: site(s) whose saved guide pages to read again (e.g. powerpyx)"
        type: string
        default: ""
      retry:
        description: "Difficulty only: site(s) to check again for games not found before (e.g. powerpyx)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: gameshelf-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.week.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/recommendations.json
          sparse-checkout-cone-mode: false
      - id: week
        run: |
          done=$(python3 -c "import json;print(json.load(open('docs/recommendations.json')).get('week',''))" 2>/dev/null || true)
          now=$(date -u +%G-W%V)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" != "7 4 * * 1" ] && [ "$done" = "$now" ]; then
            echo "This week's run already happened ($done): nothing to do."; echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  recommend:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110   # each step has its own limit, so a slow site can't stop the publish and the push
    env:
      MODE: ${{ inputs.mode || 'full' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh your data first
        timeout-minutes: 20
        if: env.MODE == 'full'
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python fetch.py
      - name: Pick this week's games and take the weekly snapshot
        timeout-minutes: 20
        if: env.MODE == 'full'
        continue-on-error: true     # a RAWG outage shouldn't cost the rest of the Monday run (a back-up run retries the picks)
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python recommend.py
      - name: Coming soon and game details
        timeout-minutes: 15
        if: env.MODE == 'full' || env.MODE == 'coming-soon'
        continue-on-error: true
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python discover.py
      - name: Platinum difficulty from guide sites
        timeout-minutes: ${{ env.MODE == 'difficulty' && 65 || 17 }}
        if: env.MODE == 'full' || env.MODE == 'difficulty'
        continue-on-error: true
        run: python difficulty.py --minutes ${{ env.MODE == 'difficulty' && inputs.minutes || '15' }} ${{ env.MODE == 'difficulty' && inputs.retry != '' && format('--retry {0}', inputs.retry) || '' }} ${{ env.MODE == 'difficulty' && inputs.reparse != '' && format('--reparse {0}', inputs.reparse) || '' }}
      - name: Sessions, On this day, calendar feed
        timeout-minutes: 5
        if: env.MODE != 'push-test'
        continue-on-error: true
        run: python extras.py
      - name: Publish
        if: env.MODE != 'push-test'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          for f in rawg_cache.json trophy_dates.json hltb_cache.json wikipedia_cache.json trophy_groups.json wikidata_about.json title_map.json rawg_tags.json rawg_details.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -q -m "Weekly recommendations"
          for attempt in 1 2 3; do
            git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main && break
            sleep 5
          done
      - name: Monday push to your phone
        if: env.MODE == 'full' || env.MODE == 'push-test'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python notify.py ${{ env.MODE == 'push-test' && '--test' || '' }}
