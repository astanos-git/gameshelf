name: Weekly recommendations

# Every Monday early morning (Swiss time), or by hand from the Actions tab.
on:
  schedule:
    - cron: "7 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameshelf-data
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh your data first
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python fetch.py
      - name: Pick this week's games and take the weekly snapshot
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python recommend.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/recommendations.json docs/snapshots.json docs/wishlist.json 2>/dev/null || true
          if [ -d docs/trophies ]; then git add docs/trophies; fi
          for f in rawg_cache.json trophy_dates.json hltb_cache.json wikipedia_cache.json trophy_groups.json wikidata_about.json title_map.json rawg_tags.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git diff --cached --quiet || git commit -q -m "Weekly recommendations"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
