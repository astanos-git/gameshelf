name: Weekly recommendations

# Every Monday early morning (Swiss time), or by hand from the Actions tab.
on:
  schedule:
    - cron: "7 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recommend
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick this week's games
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python recommend.py
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/recommendations.json rawg_tags.json
          git diff --cached --quiet || git commit -q -m "Weekly recommendations"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && break
            sleep 5
          done
