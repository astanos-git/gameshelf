name: Refresh game data

# Runs only when you press "Run workflow" (from the dashboard's Refresh link or the GitHub app).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch PSN + Metacritic data
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: python fetch.py

      - name: Publish updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if [ -f rawg_cache.json ]; then git add rawg_cache.json; fi
          git diff --cached --quiet || git commit -m "Refresh game data"
          git push
