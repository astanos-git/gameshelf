name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - env: { PSN_NPSSO: "${{ secrets.PSN_NPSSO }}" }
        run: |
          python - <<'PY'
          import os, re
          from psnawp_api import PSNAWP
          FR = re.compile(r"Poudlard|éponge|Cercle Ancien|Vilains|Saga Skywalker|Terre du Milieu|Légendaire|Vaillant", re.I)
          for label, hdr in [("default", None), ("en-US/US", {"Accept-Language": "en-US,en;q=0.9", "Country": "US"}), ("en-GB/GB", {"Accept-Language": "en-GB,en;q=0.9", "Country": "GB"})]:
              me = (PSNAWP(os.environ["PSN_NPSSO"], headers=hdr) if hdr else PSNAWP(os.environ["PSN_NPSSO"])).me()
              tro = [t.title_name for t in me.trophy_titles(limit=None)]
              sta = [s.name for s in me.title_stats(limit=None)]
              ent = [(e.get("conceptMeta") or {}).get("name") or (e.get("titleMeta") or {}).get("name") for e in me.game_entitlements(limit=None)]
              for src, names in [("trophies", tro), ("playtime", sta), ("owned", ent)]:
                  fr = sorted({n for n in names if n and FR.search(n)})
                  print(f"::warning::{label} {src}: {len(names)} titles, French-looking: {fr[:8]}")
              print(f"::warning::{label} region: {me.get_region()}")
          PY
