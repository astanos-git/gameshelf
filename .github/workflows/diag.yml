name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          import fetch, re
          for t in ["Battlefield 1", "EA Sports FC 24", "Immortals of Aveum", "Core Keeper"]:
              w = fetch.wiki_get({"action": "parse", "page": t, "prop": "wikitext", "redirects": 1, "formatversion": 2})["parse"]["wikitext"]
              i = w.find("MC")
              box = re.search(r"\{\{\s*Video game (multiple console )?reviews", w, re.I)
              print(f"::warning::{t} | box={bool(box)} | len={len(w)} | around MC: " + repr(w[max(0,i-80):i+220]) if i >= 0 else f"::warning::{t} | box={bool(box)} | no 'MC' in page")
          PY
