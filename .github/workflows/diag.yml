name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          import fetch, traceback
          for n in ["Metaphor: ReFantazio", "Alan Wake 2", "Lies of P", "Balatro", "SILENT HILL 2"]:
              try:
                  print(f"::warning::{n} -> {fetch.wikipedia_lookup(n)}")
              except Exception as e:
                  print(f"::warning::{n} -> ERROR {type(e).__name__}: {str(e)[:250]}")
          PY
